name: Publish npm packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish
        required: true
        type: string
      skip_site:
        description: Skip the @nawc/site package
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.11.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release
        run: pnpm run ci

      - name: Verify tag and package versions
        run: pnpm run release:verify
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

      - name: Pack packages
        run: |
          mkdir -p "${{ runner.temp }}/nawc-packages"
          pnpm \
            --filter './packages/**' \
            --filter './plugins/**' \
            --filter './provider/**' \
            --filter './editor/**' \
            --filter './theme/**' \
            -r pack \
            --pack-destination "${{ runner.temp }}/nawc-packages"

      - name: Publish packages
        run: |
          for archive in "${{ runner.temp }}"/nawc-packages/*.tgz; do
            manifest="$(tar -xOf "$archive" package/package.json)"
            name="$(node -p 'JSON.parse(process.argv[1]).name' "$manifest")"
            version="$(node -p 'JSON.parse(process.argv[1]).version' "$manifest")"

            if [[ "$name" == "@nawc/site" && "${{ inputs.skip_site }}" == "true" ]]; then
              echo "Skipping $name@$version because skip_site was requested"
            elif npm view "$name@$version" version >/dev/null 2>&1; then
              echo "Skipping $name@$version because it is already published"
            else
              npm publish "$archive"
            fi
          done
