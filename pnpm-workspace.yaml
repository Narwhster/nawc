packages:
  - packages/*
  - plugins/*
  - provider/*
  - editor/*
  - theme/*
  - examples/*
  - .notebook

catalogMode: prefer

catalog:
  "@types/node": ^24
  typescript: ^6
  zod: ^4.4.3
  vite: ^8.1.4
  vitest: ^4.1.10
  vite-plus: latest
  shadcn: ^4.13.0
  tw-animate-css: ^1.4.0
  radix-ui: ^1.6.2
  jsdom: ^29.1.1
  dockview-react: ^6.6.1
  zustand: ^5.0.14
  highlight.js: ^11.11.1
  minisearch: ^7.2.0
  parse5: ^8.0.1
  cmdk: ^1.1.1
  react-resizable-panels: ^4.12.1
  sonner: ^2.0.7
  react-markdown: ^10.1.0
  remark-gfm: ^4.0.1
  "@tiptap/extension-table": ^3.28.0
  "@playwright/test": ^1.61.1
  wrangler: ^4.114.0

minimumReleaseAgeExclude:
  - hono@4.12.29

# tree-sitter-rust ships a prebuilt .wasm grammar; its native binding build is unnecessary.
allowBuilds:
  "@google/genai": false
  esbuild: true
  node-pty: true
  protobufjs: false
  tree-sitter-rust: false
  workerd: true
